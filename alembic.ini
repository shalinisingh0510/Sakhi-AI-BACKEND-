# Alembic configuration for Sakhi AI
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts — relative to this file
script_location = alembic

# The database URL is loaded programmatically in env.py from the
# application settings (SAKHI_DATABASE_URL).  This placeholder is
# overridden at runtime.
sqlalchemy.url = postgresql://localhost/sakhi

# Template for new migration filenames
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision identifiers
truncate_slug_length = 40

# Timezone for migration filenames
# timezone =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
